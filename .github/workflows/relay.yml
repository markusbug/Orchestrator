name: relay

on:
  push:
    tags: ["relay-v*"]
  pull_request:
    paths: ["deploy/relay/**", ".github/workflows/relay.yml"]
  workflow_dispatch:

# The default for every job here; the release jobs opt up individually.
permissions:
  contents: read

jobs:
  lint-deploy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: shell syntax
        run: bash -n deploy/relay/install.sh
      - name: shellcheck
        run: shellcheck -S warning deploy/relay/install.sh

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # record it
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git describe needs tags
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - id: ver
        name: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            v="${GITHUB_REF_NAME#relay-}"
          else
            v="$(git describe --tags --match 'relay-v*' --always --dirty | sed 's/^relay-//')"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # Tag pushes do not trigger daemon.yml (it filters on branches), so the
      # relay's tests run here too.
      - name: test
        run: go vet ./... && go test -race -timeout 300s ./internal/relay/... ./internal/api/... ./cmd/relay/...
      - name: build linux/amd64 and linux/arm64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOFLAGS: -trimpath
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            GOARCH=$arch go build -ldflags "-s -w -X github.com/markusbug/Orchestrator/daemon/internal/buildinfo.Version=${{ steps.ver.outputs.version }}" \
              -o ../dist/relay_linux_$arch ./cmd/relay
          done
          tar -czf ../dist/relay-deploy.tar.gz -C ../deploy relay
          (cd ../dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relay-dist
          path: dist/
          retention-days: 14
      # Signs each artifact to this workflow, commit and runner, which is what
      # SHA256SUMS cannot do: the sums file sits in the release an attacker
      # would be replacing. SECURITY.md has the rest. Needs a public repo, so
      # the gate below turns this on by itself once the repo is published.
      - name: attest provenance
        if: github.ref_type == 'tag' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true
