name: daemon

on:
  push:
    branches: [main]
    paths: ["daemon/**", ".github/workflows/daemon.yml"]
  pull_request:
    paths: ["daemon/**", ".github/workflows/daemon.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -timeout 300s ./...
      - name: cross-compile darwin/arm64
        run: GOOS=darwin GOARCH=arm64 go build -o /dev/null ./...
      - name: cross-compile linux/arm64
        run: GOOS=linux GOARCH=arm64 go build -o /dev/null ./...
      - name: build
        run: go build -ldflags "-s -w -X github.com/markusbug/Orchestrator/daemon/internal/buildinfo.Version=${GITHUB_SHA::8}" -o ../bin/orchestrator ./cmd/orchestrator
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orchestrator-linux-amd64
          path: bin/orchestrator
      - name: build relay
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/markusbug/Orchestrator/daemon/internal/buildinfo.Version=${GITHUB_SHA::8}" -o ../bin/relay ./cmd/relay
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relay-linux-amd64
          path: bin/relay
