name: ios

# Builds an unsigned IPA on a macOS runner. macOS minutes are expensive on a
# private repo, so this runs only on app-v* tags or by hand.
on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - name: pub get
        run: flutter pub get
      - name: analyze
        run: flutter analyze
      - name: build (no codesign)
        run: flutter build ios --release --no-codesign
      - name: package IPA
        run: |
          set -euo pipefail
          rm -rf Payload && mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr Orchestrator-unsigned.ipa Payload
          ls -la Orchestrator-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Orchestrator-unsigned.ipa
          path: app/Orchestrator-unsigned.ipa
      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/Orchestrator-unsigned.ipa
          generate_release_notes: true
