name: ios

# Builds an unsigned IPA on a macOS runner. macOS minutes are expensive on a
# private repo, so this runs only on app-v* tags or by hand.
on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:

# The default for every job here; the release jobs opt up individually.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # record it
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - name: pub get
        run: flutter pub get
      - name: analyze
        run: flutter analyze
      - name: build (no codesign)
        run: flutter build ios --release --no-codesign
      - name: package IPA
        run: |
          set -euo pipefail
          rm -rf Payload && mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr Orchestrator-unsigned.ipa Payload
          ls -la Orchestrator-unsigned.ipa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Orchestrator-unsigned.ipa
          path: app/Orchestrator-unsigned.ipa
      # Signs each artifact to this workflow, commit and runner, which is what
      # SHA256SUMS cannot do: the sums file sits in the release an attacker
      # would be replacing. SECURITY.md has the rest. Needs a public repo, so
      # the gate below turns this on by itself once the repo is published.
      - name: attest provenance
        if: github.ref_type == 'tag' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: app/Orchestrator-unsigned.ipa
      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: app/Orchestrator-unsigned.ipa
          generate_release_notes: true
