# Orchestrator relay: kernel tuning for very many mostly idle TLS connections.
# Installed to /etc/sysctl.d/90-relay.conf by install.sh. Values assume 4 GB;
# see the comments for 2 GB.

# fs.file-max scales with RAM by default (roughly 200k on 2 GB, 400k on 4 GB).
# 100k connections need 100k fds plus headroom. fs.nr_open (per-process
# ceiling, default 1048576) matches LimitNOFILE in relay.service; raise both
# together if ever needed.
fs.file-max = 2097152

# Accept queue during a reconnect storm (every host redials after a restart).
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 8192

# TCP memory in 4 KiB pages; max here is 1 GiB. On 2 GB use 65536 87380 131072.
net.ipv4.tcp_mem = 131072 174762 262144
# Small default per-socket buffers so idle hosts are cheap; autotuning grows
# the active ones.
net.ipv4.tcp_rmem = 4096 87380 6291456
net.ipv4.tcp_wmem = 4096 16384 4194304
# Bound unsent bytes buffered per socket so a slow phone cannot park megabytes
# in kernel memory.
net.ipv4.tcp_notsent_lowat = 16384

# Kernel keepalive is a backstop for the relay's own per-socket setting.
# Daemons ping every 60 s at the application layer.
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5

net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_slow_start_after_idle = 0

# net.ipv4.ip_local_port_range is deliberately not set: the relay accepts, it
# does not dial (except a handful of ACME requests). It matters on a load-test
# client, not here.
