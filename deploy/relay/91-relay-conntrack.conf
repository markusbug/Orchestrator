# Only installed when ufw is in use (install.sh without --no-ufw). ufw's
# conntrack rules track every flow; size the table for the connection count.
# Preferred setup is the Hetzner Cloud Firewall with --no-ufw, where
# nf_conntrack never loads and none of this applies.
net.netfilter.nf_conntrack_max = 1048576
# Default is 5 days; hosts ping every 60 s, so stale entries can go sooner.
net.netfilter.nf_conntrack_tcp_timeout_established = 3600
